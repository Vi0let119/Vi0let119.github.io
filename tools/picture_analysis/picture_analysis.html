<!DOCTYPE html>
<!-- 图片色彩分析工具页：左侧上传预览图片，右侧控制参数并渲染主色饼图/柱状图与 RGB 直方图
     分析逻辑全部在 imageAnalyzer.js（K-means 聚类 + 色彩空间转换） -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片色彩分析 — Color Analysis</title>
    <link rel="stylesheet" href="../tools_theme.css">
    <link rel="stylesheet" href="picture_analysis.css">
    <link rel="stylesheet" href="../../siderbar/siderbar.css">
    <script src="../../echarts.min.js"></script>
    <script src="../../siderbar/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initSidebar('sidebar-container');
        });
    </script>
</head>
<body class="theme-tools-dark">
    <div id="sidebar-container"></div>

    <div class="layout-container">
        <h1 class="visually-hidden">图片色彩分析</h1>

        <div class="image-panel">
        <h2 class="image-panel-title">图片浏览</h2>
        <br>
        <div class="image-preview">
            <input type="file" id="imageInput" accept="image/*" class="image-upload" aria-label="上传图片">
            <img id="displayImage" alt="点我上传图片">
        </div>
        </div>

        <!-- 右侧：分析参数控制 + 结果图表 -->
        <div class="picture_details" id="pictureDetails">

        <div class="control-panel">
            <div class="control-item">
                <label for="kValueSlider">K值 (聚类数量): <span id="kValueDisplay">5</span></label>
                <input type="range" id="kValueSlider" min="2" max="10" value="5">
            </div>

            <div class="control-item">
                <label for="spaceSelect">颜色空间:</label>
                <select id="spaceSelect">
                    <option value="rgb">RGB</option>
                    <option value="lab">LAB</option>
                </select>
            </div>

            <div class="control-item">
                <span class="control-label">图表类型:</span>
                <button class="chart-type-btn active" data-type="pie">饼图</button>
                <button class="chart-type-btn" data-type="bar">柱状图</button>
            </div>

            <div class="control-item">
                <button id="startAnalysisBtn">开始分析</button>
            </div>

            <div id="chartContainer"></div>

            <div id="rgbHistogram"></div>

            
        </div>

        
        </div>
    </div>
     <script type="module" src="imageAnalyzer.js"></script>
</body>
</html>
