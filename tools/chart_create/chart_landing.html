<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表生成 — Chart Generator</title>
    <link rel="stylesheet" href="../tools_theme.css">
    <style>
        /* ============================================
           图表生成 · 模式选择 — 墨色 × 铜金
           ============================================ */

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 52px;
        }

        .header-mark {
            display: block;
            width: 1px;
            height: 36px;
            margin: 0 auto 22px;
            background: linear-gradient(to bottom, transparent, var(--accent-border));
        }

        .header-eyebrow { display: block; margin-bottom: 18px; }

        .title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            font-weight: 500;
            letter-spacing: 0.14em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
        }

        /* ── Cards ── */
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            padding: 28px 26px 26px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-decoration: none;
            color: inherit;
            overflow: hidden;
            transition:
                transform 0.3s var(--ease),
                border-color 0.3s var(--ease),
                background 0.3s var(--ease);
            animation: fadeUp 0.55s var(--ease) backwards;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.15s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-border);
            background: var(--bg-secondary);
        }

        /* 右上角模式代号，hover 时让位给箭头 */
        .card-num {
            position: absolute;
            top: 24px;
            right: 24px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            transition: opacity 0.25s var(--ease);
        }

        .card::after {
            content: '→';
            position: absolute;
            top: 22px;
            right: 24px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--accent);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
        }

        .card:hover .card-num { opacity: 0; }
        .card:hover::after { opacity: 1; transform: translateX(0); }

        .card-icon {
            display: flex;
            align-items: center;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .card-desc {
            font-size: 0.84rem;
            color: var(--text-secondary);
            line-height: 1.75;
            margin-bottom: 18px;
            flex: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            padding: 3px 9px;
            border-radius: 2px;
            border: 1px solid var(--hairline);
            color: var(--text-muted);
            transition: border-color 0.3s var(--ease);
        }

        .card:hover .tag { border-color: var(--border-strong); }

        /* ── Footer ── */
        .footer {
            margin-top: 52px;
            padding-top: 22px;
            border-top: 1px solid var(--hairline);
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            letter-spacing: 0.12em;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.25s var(--ease);
        }

        .footer a:hover { color: var(--accent); }

        .footer a::before { content: '← '; }

        .footer .divider {
            color: var(--text-muted);
            opacity: 0.5;
            margin: 0 14px;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
            .card { padding: 24px 20px 22px; }
        }
    </style>
</head>
<body class="theme-tools-dark">
    <div class="container">

        <!-- Header -->
        <header class="header">
            <span class="header-mark"></span>
            <span class="tt-eyebrow header-eyebrow">Chart Generator</span>
            <h1 class="title">图表生成</h1>
            <p class="subtitle">基于 ECharts / D3，按数据形态选择入口</p>
        </header>

        <!-- Cards -->
        <div class="cards">
            <!-- 极速版 -->
            <a href="chart_quick.html" class="card">
                <span class="card-num">A</span>
                <div class="card-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <div class="card-title">极速版</div>
                <div class="card-desc">
                    数据规整时用。粘贴或上传数据，选好图表类型，直接出图。
                </div>
                <div class="card-tags">
                    <span class="tag">柱状图</span>
                    <span class="tag">折线图</span>
                    <span class="tag">饼图</span>
                    <span class="tag">散点图</span>
                </div>
            </a>

            <!-- AI 交互版 -->
            <a href="chart_ai.html" class="card">
                <span class="card-num">B</span>
                <div class="card-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <div class="card-title">AI 交互版</div>
                <div class="card-desc">
                    数据杂乱时用。把原始数据交给对话，由它整理并生成图表。
                </div>
                <div class="card-tags">
                    <span class="tag">对话整理</span>
                    <span class="tag">多轮分析</span>
                    <span class="tag">自由格式</span>
                </div>
            </a>
        </div>

        <!-- Footer -->
        <p class="footer">
            <a href="../tools_index.html">工具箱</a>
            <span class="divider">·</span>
            <a href="../../index.html">首页</a>
        </p>
    </div>
</body>
</html>
