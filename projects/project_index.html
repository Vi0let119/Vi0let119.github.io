<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目 · Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        // 尽早应用主题，避免闪白
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') {
                document.documentElement.setAttribute('data-theme', t);
            }
        })();
    </script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../siderbar/siderbar.css">
    <script src="../theme.js"></script>
    <script src="../siderbar/sidebar.js"></script>
    <style>
        /* ============================================
           项目索引 — 杂志目录式竖排索引(暖白,与主页亮色协调)
           新增项目:复制下面 <li> 模板块,改链接与文字即可,零 CSS 改动
           ============================================ */

        .proj-page { max-width: 720px; }

        /* ── 页头 ── */
        .proj-header { padding: 2rem 0 1rem; }

        .proj-eyebrow {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .proj-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .proj-sub {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* ── 列表 ── */
        .proj-list { list-style: none; }

        .proj-list li { animation: projFadeUp 0.55s ease backwards; }
        .proj-list li:nth-child(1) { animation-delay: 0.05s; }
        .proj-list li:nth-child(2) { animation-delay: 0.12s; }
        .proj-list li:nth-child(3) { animation-delay: 0.19s; }
        .proj-list li:nth-child(4) { animation-delay: 0.26s; }
        .proj-list li:nth-child(5) { animation-delay: 0.33s; }

        .proj-list li + li { border-top: 1px solid rgba(0, 0, 0, 0.07); }

        [data-theme="dark"] .proj-list li + li { border-top-color: rgba(232, 224, 213, 0.12); }

        .proj-row {
            display: grid;
            grid-template-columns: 56px 1fr auto auto;
            align-items: center;
            gap: 16px;
            padding: 28px 8px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: background 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .proj-row:hover { background: #fff; }
        [data-theme="dark"] .proj-row:hover { background: rgba(232, 224, 213, 0.06); }
        .proj-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        .proj-num {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .proj-main { transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1); }
        .proj-row:hover .proj-main { transform: translateX(6px); }

        .proj-main h2 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            line-height: 1.2;
            transition: color 0.3s ease;
        }

        .proj-row:hover .proj-main h2 { color: var(--accent); }

        .proj-en {
            font-size: 0.8rem;
            font-style: italic;
            color: var(--text-muted);
            margin-left: 8px;
            letter-spacing: 0.04em;
        }

        .proj-main p {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ── 状态标签(三态) ── */
        .proj-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .proj-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .tag--done { color: #4c7a5f; background: #e9f2ec; }
        .tag--dev  { color: #b07a3c; background: #f7efe2; }
        .tag--plan { color: #6b7280; background: #eceef1; }

        /* 夜间:底片上的状态标签,提字降底 */
        [data-theme="dark"] .tag--done { color: #a9c9b4; background: rgba(169, 201, 180, 0.1); }
        [data-theme="dark"] .tag--dev  { color: #cfb984; background: rgba(212, 168, 83, 0.1); }
        [data-theme="dark"] .tag--plan { color: rgba(232, 224, 213, 0.55); background: rgba(232, 224, 213, 0.07); }

        /* ── 箭头 ── */
        .proj-arrow {
            font-size: 1.05rem;
            color: var(--text-muted);
            transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1), color 0.3s ease;
        }

        .proj-row:hover .proj-arrow {
            transform: translateX(4px);
            color: var(--accent);
        }

        /* ── 页脚 ── */
        .proj-footer { padding: 1.5rem 0; }

        .proj-footer a {
            font-size: 0.88rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .proj-footer a:hover { color: var(--accent); }

        @keyframes projFadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── 窄屏:压缩列宽 ── */
        @media (max-width: 600px) {
            .proj-row {
                grid-template-columns: 36px 1fr auto auto;
                gap: 12px;
                padding: 22px 4px;
            }
            .proj-main h2 { font-size: 1.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .proj-list li { animation: none; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    <div class="theme-grain" aria-hidden="true"></div>

    <button class="theme-toggle" id="themeToggle" aria-label="切换日/夜模式" title="切换日/夜模式">
        <span class="theme-icon theme-icon--light">☀</span>
        <span class="theme-icon theme-icon--dark">☽</span>
    </button>

    <main class="main proj-page">

        <!-- ============ 页头 ============ -->
        <header class="proj-header">
            <p class="proj-eyebrow">Projects · 项目档案</p>
            <h1 class="proj-title">项目</h1>
            <p class="proj-sub">把做过的事，一件一件摆出来。</p>
        </header>

        <!-- ============ 项目列表 ============ -->
        <ol class="proj-list">

            <!-- #01 轻笺 -->
            <li>
                <a class="proj-row" href="qingjian/qingjian_overview.html">
                    <span class="proj-num">01</span>
                    <span class="proj-main">
                        <h2>轻笺<span class="proj-en">QingJian</span></h2>
                        <p>轻量碎片便签 · 随时唤醒碎片窗口 · 自动按天整理</p>
                    </span>
                    <span class="proj-tag tag--dev">开发中</span>
                    <span class="proj-arrow">→</span>
                </a>
            </li>

            <!-- #02 写作提词器 -->
            <li>
                <a class="proj-row" href="wordpane/wordpane_overview.html">
                    <span class="proj-num">02</span>
                    <span class="proj-main">
                        <h2>写作提词器<span class="proj-en">WordPane</span></h2>
                        <p>悬浮词库小窗 · AI 词汇扩展 + 内嵌搜索 · Tauri 2</p>
                    </span>
                    <span class="proj-tag tag--dev">开发中</span>
                    <span class="proj-arrow">→</span>
                </a>
            </li>

            <!-- #03 Perch 桌宠 -->
            <li>
                <a class="proj-row" href="perch/perch_overview.html">
                    <span class="proj-num">03</span>
                    <span class="proj-main">
                        <h2>Perch<span class="proj-en">Desktop Pet</span></h2>
                        <p>桌面宠物计划提醒 · 到点弹气泡 · Live2D 换肤</p>
                    </span>
                    <span class="proj-tag tag--dev">开发中</span>
                    <span class="proj-arrow">→</span>
                </a>
            </li>

            <!-- 新项目模板：复制下面注释内的 <li> 整块，取消注释后改链接/编号/名称/简介/状态即可。
                 状态标签三选一：tag--done 已完成 / tag--dev 开发中 / tag--plan 规划中。
                 注意：HTML 注释不支持嵌套，注释说明文字里不要出现注释起止符，否则会提前闭合导致文字外泄。 -->
            <!--
            <li>
                <a class="proj-row" href="新项目/overview.html">
                    <span class="proj-num">02</span>
                    <span class="proj-main">
                        <h2>项目名<span class="proj-en">English</span></h2>
                        <p>一句话简介 · 关键词 · 关键词</p>
                    </span>
                    <span class="proj-tag tag--done">已完成</span>
                    <span class="proj-arrow">→</span>
                </a>
            </li>
            -->

        </ol>

        <!-- ============ 页脚 ============ -->
        <footer class="proj-footer">
            <a href="../index.html">← 返回首页</a>
        </footer>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initSidebar('sidebar-container');
        });
    </script>
</body>
</html>
