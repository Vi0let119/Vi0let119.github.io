<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="同一个 Venus 模型在两篇论文里有两个分数：GAICv2 Acc1/5 为 83.8，GAIC ACC10 为 94.5，因为尺子不同">
  <rect x="0" y="0" width="720" height="280" fill="#fbf7ee"/>
  <rect x="0.5" y="0.5" width="719" height="279" fill="none" stroke="#d8cbb4"/>
  <text x="36" y="34" font-family="Space Mono, monospace" font-size="11" letter-spacing="2" fill="#8a7c68">FIG. 11 — TWO RULERS</text>
  <text x="684" y="34" text-anchor="end" font-family="Space Mono, monospace" font-size="10" letter-spacing="1" fill="#a89b88">CROPPING · 2026-10</text>
  <text x="36" y="62" font-family="Noto Serif SC, serif" font-size="20" fill="#2a241c">同一个 Venus，两个分数</text>
  <line x1="36" y1="78" x2="684" y2="78" stroke="#c9bda8" stroke-width="0.7"/>

  <text x="36" y="104" font-family="Noto Serif SC, serif" font-size="12" fill="#5b5044">FrameLite 的尺子 · GAICv2 Acc@0.85</text>
  <text x="150" y="132" text-anchor="end" font-family="Space Mono, monospace" font-size="10" fill="#5b5044">FrameLite 0.8B</text>
  <rect x="160" y="120" width="393" height="16" fill="#5b7b8a" opacity="0.75"/>
  <text x="559" y="132" font-family="Space Mono, monospace" font-size="10" fill="#5b7b8a">91.4</text>
  <text x="150" y="160" text-anchor="end" font-family="Space Mono, monospace" font-size="10" fill="#5b5044">Venus 7B</text>
  <rect x="160" y="148" width="360" height="16" fill="#9a4a32" opacity="0.55"/>
  <text x="526" y="160" font-family="Space Mono, monospace" font-size="10" fill="#9a4a32">83.8</text>

  <line x1="36" y1="182" x2="684" y2="182" stroke="#c9bda8" stroke-width="0.6" stroke-dasharray="2 5"/>

  <text x="36" y="206" font-family="Noto Serif SC, serif" font-size="12" fill="#5b5044">CPIC 的尺子 · GAIC ACC10</text>
  <text x="150" y="234" text-anchor="end" font-family="Space Mono, monospace" font-size="10" fill="#5b5044">Venus 7B</text>
  <rect x="160" y="222" width="406" height="16" fill="#9a4a32" opacity="0.55"/>
  <text x="572" y="234" font-family="Space Mono, monospace" font-size="10" fill="#9a4a32">94.5</text>
  <text x="150" y="262" text-anchor="end" font-family="Space Mono, monospace" font-size="10" fill="#5b5044">CPIC 2B</text>
  <rect x="160" y="250" width="389" height="16" fill="#5b7b8a" opacity="0.75"/>
  <text x="555" y="262" font-family="Space Mono, monospace" font-size="10" fill="#5b7b8a">90.5</text>
</svg>
