<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="同一台 390 像素手机上，17 个页面为 390，轻笺页为 400，GPS 页为 498">
  <rect x="0" y="0" width="720" height="260" fill="#fbf7ee"/>
  <rect x="0.5" y="0.5" width="719" height="259" fill="none" stroke="#d8cbb4"/>
  <text x="36" y="34" font-family="Space Mono, monospace" font-size="11" letter-spacing="2" fill="#8a7c68">FIG. 06 — 390 VIEWPORT</text>
  <text x="684" y="34" text-anchor="end" font-family="Space Mono, monospace" font-size="10" letter-spacing="1" fill="#a89b88">19 PAGES SWEPT</text>
  <text x="36" y="62" font-family="Noto Serif SC, serif" font-size="20" fill="#2a241c">同一台手机，三种视口</text>
  <line x1="36" y1="78" x2="684" y2="78" stroke="#c9bda8" stroke-width="0.7"/>

  <line x1="510" y1="92" x2="510" y2="206" stroke="#9a4a32" stroke-width="0.8" stroke-dasharray="3 4"/>
  <text x="510" y="88" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" fill="#9a4a32">390 DEVICE</text>

  <text x="108" y="114" text-anchor="end" font-family="Noto Serif SC, serif" font-size="11" fill="#5b5044">其余 17 页</text>
  <rect x="120" y="100" width="390" height="20" fill="#5b7b8a" opacity="0.7"/>
  <text x="518" y="114" font-family="Space Mono, monospace" font-size="10" fill="#5b7b8a">390</text>

  <text x="108" y="154" text-anchor="end" font-family="Noto Serif SC, serif" font-size="11" fill="#5b5044">轻笺</text>
  <rect x="120" y="140" width="400" height="20" fill="#9a4a32" opacity="0.7"/>
  <text x="528" y="154" font-family="Space Mono, monospace" font-size="10" fill="#9a4a32">400 (+10)</text>

  <text x="108" y="194" text-anchor="end" font-family="Noto Serif SC, serif" font-size="11" fill="#5b5044">GPS 标记</text>
  <rect x="120" y="180" width="498" height="20" fill="#857a6b" opacity="0.8"/>
  <text x="626" y="194" font-family="Space Mono, monospace" font-size="10" fill="#857a6b">498 (+108)</text>

  <text x="36" y="228" font-family="Noto Serif SC, serif" font-size="10.5" fill="#5b5044">数字是布局视口宽度，不是内容高度：被撑大后，浏览器会把整页缩小，而不是出现滚动条。</text>
  <line x1="36" y1="240" x2="684" y2="240" stroke="#c9bda8" stroke-width="0.6" stroke-dasharray="2 5"/>
  <text x="36" y="254" font-family="Space Mono, monospace" font-size="9" letter-spacing="1" fill="#a89b88">innerWidth · clientWidth · scrollWidth · 2026-10-20</text>
  <text x="684" y="254" text-anchor="end" font-family="Space Mono, monospace" font-size="9" letter-spacing="1" fill="#a89b88">ALL 390 AFTER FIX</text>
</svg>
