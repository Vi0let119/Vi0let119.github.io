<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="改动前后同一段 DOM 的标题顺序：改前 H3 快速到达在 H1 之前，改后 H1 在最前，侧栏变成具名导航地标">
  <rect width="1120" height="520" fill="#f2f0e8"/>
  <g font-family="'Noto Serif SC', 'Songti SC', serif" fill="#1c1b18">
    <text x="60" y="64" font-size="26" letter-spacing="2">同一段 DOM，两种读法</text>
    <text x="60" y="96" font-size="14" fill="#8d8676">侧栏在 body 最前面，正文的 h1 在 main 里 —— 顺序由位置决定，不由字号决定</text>
  </g>

  <!-- 左栏：改动前 -->
  <g>
    <text x="60" y="152" font-size="15" fill="#a83a31" letter-spacing="3">改 前</text>
    <line x1="60" y1="166" x2="520" y2="166" stroke="#a83a31" stroke-opacity="0.35"/>
    <g font-family="'DM Mono', Consolas, monospace" font-size="15">
      <text x="60" y="212" fill="#8d8676">body</text>
      <text x="96" y="248" fill="#a83a31">└ H3　快速到达</text>
      <text x="140" y="272" font-size="12" fill="#8d8676">侧栏标题，先出现</text>
      <text x="96" y="316" fill="#1c1b18">└ H1　身体星图</text>
      <text x="140" y="340" font-size="12" fill="#8d8676">页面标题，反而在后</text>
    </g>
    <text x="60" y="404" font-size="13" fill="#4a463c">读屏按 H 键跳转：先落在一个「节标题」上，</text>
    <text x="60" y="426" font-size="13" fill="#4a463c">再往回找到 h1。大纲的第一层是空的。</text>
  </g>

  <!-- 右栏：改动后 -->
  <g>
    <text x="600" y="152" font-size="15" fill="#2e4b3f" letter-spacing="3">改 后</text>
    <line x1="600" y1="166" x2="1060" y2="166" stroke="#2e4b3f" stroke-opacity="0.35"/>
    <g font-family="'DM Mono', Consolas, monospace" font-size="15">
      <text x="600" y="212" fill="#8d8676">body</text>
      <text x="636" y="248" fill="#2e4b3f">├ nav　快速到达</text>
      <text x="680" y="272" font-size="12" fill="#8d8676">地标，有名字，不是标题</text>
      <text x="636" y="316" fill="#1c1b18">└ H1　身体星图</text>
      <text x="680" y="340" font-size="12" fill="#8d8676">大纲从这里开始</text>
    </g>
    <text x="600" y="404" font-size="13" fill="#4a463c">十个页面共用这段模板，改一处，</text>
    <text x="600" y="426" font-size="13" fill="#4a463c">每个页面的第一个标题都回到 H1。</text>
  </g>

  <line x1="560" y1="120" x2="560" y2="450" stroke="#1c1b18" stroke-opacity="0.12" stroke-dasharray="3 5"/>
  <text x="60" y="488" font-size="12" fill="#8d8676">2026-10-20 · 标题层级审计 · 10 个页面 × 1440 / 390</text>
</svg>
