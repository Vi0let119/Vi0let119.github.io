<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="图表宽度修复前后：初始化时 398 像素的图表把 390 的布局视口撑到 432，修复后图表缩到 323，视口回到 390">
  <rect x="0" y="0" width="720" height="280" fill="#fbf7ee"/>
  <rect x="0.5" y="0.5" width="719" height="279" fill="none" stroke="#d8cbb4"/>
  <text x="36" y="34" font-family="Space Mono, monospace" font-size="11" letter-spacing="2" fill="#8a7c68">FIG. 10 — MEASURED ONCE</text>
  <text x="684" y="34" text-anchor="end" font-family="Space Mono, monospace" font-size="10" letter-spacing="1" fill="#a89b88">ECHARTS · 390 VIEWPORT</text>
  <text x="36" y="62" font-family="Noto Serif SC, serif" font-size="20" fill="#2a241c">图表只量了一次</text>
  <line x1="36" y1="78" x2="684" y2="78" stroke="#c9bda8" stroke-width="0.7"/>

  <line x1="540" y1="92" x2="540" y2="232" stroke="#9a4a32" stroke-width="0.8" stroke-dasharray="3 4"/>
  <text x="540" y="88" text-anchor="middle" font-family="Space Mono, monospace" font-size="9" fill="#9a4a32">390 DEVICE</text>

  <text x="140" y="112" text-anchor="end" font-family="Noto Serif SC, serif" font-size="11" fill="#5b5044">修复前 · 先宽后窄</text>
  <rect x="150" y="118" width="398" height="16" fill="#9a4a32" opacity="0.72"/>
  <text x="552" y="130" font-family="Space Mono, monospace" font-size="9" fill="#9a4a32">chart 398</text>
  <rect x="150" y="140" width="432" height="7" fill="#9a4a32" opacity="0.3"/>
  <text x="586" y="147" font-family="Space Mono, monospace" font-size="9" fill="#9a4a32">viewport 432 (+42)</text>

  <text x="140" y="184" text-anchor="end" font-family="Noto Serif SC, serif" font-size="11" fill="#5b5044">修复后 · 跟着缩放</text>
  <rect x="150" y="190" width="323" height="16" fill="#5b7b8a" opacity="0.75"/>
  <text x="477" y="202" font-family="Space Mono, monospace" font-size="9" fill="#5b7b8a">chart 323</text>
  <rect x="150" y="212" width="390" height="7" fill="#5b7b8a" opacity="0.35"/>
  <text x="544" y="219" font-family="Space Mono, monospace" font-size="9" fill="#5b7b8a">viewport 390</text>

  <text x="36" y="252" font-family="Noto Serif SC, serif" font-size="10.5" fill="#5b5044">图表左边缘在 34 像素处：34 + 398 = 432，所以多出来的不是 8，是 42。</text>
  <line x1="36" y1="262" x2="684" y2="262" stroke="#c9bda8" stroke-width="0.6" stroke-dasharray="2 5"/>
  <text x="36" y="274" font-family="Space Mono, monospace" font-size="9" letter-spacing="1" fill="#a89b88">innerWidth · ECharts · 2026-10-20</text>
  <text x="684" y="274" text-anchor="end" font-family="Space Mono, monospace" font-size="9" letter-spacing="1" fill="#a89b88">RESIZE() AFTER 150 MS</text>
</svg>
