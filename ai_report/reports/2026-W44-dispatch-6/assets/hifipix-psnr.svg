<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-label="三个真实世界超分基准上的 PSNR：HiFiPix 在 DRealSR 29.62、GGT 26.86、Dual-Q 23.21，均高于 TVT 与 PiSA-SR">
  <rect width="1120" height="430" fill="#0d0d11"/>
  <g font-family="'Noto Serif SC', 'Songti SC', serif" fill="#f0ece4">
    <text x="56" y="56" font-size="24" letter-spacing="1">三个基准，一种颜色</text>
    <text x="56" y="84" font-size="13" fill="#78746e">PSNR（dB，越高越好）；每个基准按自身最低–最高归一化到 600 px，不跨基准比较</text>
  </g>
  <g font-family="'DM Mono', Consolas, monospace" font-size="12" fill="#78746e">
    <text x="56" y="122">DRealSR</text>
    <text x="56" y="232">GGT-GeneralMix</text>
    <text x="56" y="342">Dual-Q-Bench</text>
  </g>
  <g>
    <rect x="300" y="102" width="600" height="14" fill="#5a9a7a"/>
    <text x="910" y="114" font-size="12" fill="#9cc4ab" font-family="'DM Mono', Consolas, monospace">29.62</text>
    <rect x="300" y="122" width="463" height="14" fill="#4a4a52"/>
    <text x="773" y="134" font-size="12" fill="#8f8a82" font-family="'DM Mono', Consolas, monospace">28.31 PiSA-SR</text>
    <rect x="300" y="142" width="456" height="14" fill="#4a4a52"/>
    <text x="766" y="154" font-size="12" fill="#8f8a82" font-family="'DM Mono', Consolas, monospace">28.25 TVT</text>

    <rect x="300" y="212" width="600" height="14" fill="#5a9a7a"/>
    <text x="910" y="224" font-size="12" fill="#9cc4ab" font-family="'DM Mono', Consolas, monospace">26.86</text>
    <rect x="300" y="232" width="546" height="14" fill="#4a4a52"/>
    <text x="856" y="244" font-size="12" fill="#8f8a82" font-family="'DM Mono', Consolas, monospace">26.41 TVT</text>
    <rect x="300" y="252" width="513" height="14" fill="#4a4a52"/>
    <text x="823" y="264" font-size="12" fill="#8f8a82" font-family="'DM Mono', Consolas, monospace">26.13 PiSA-SR</text>

    <rect x="300" y="322" width="600" height="14" fill="#5a9a7a"/>
    <text x="910" y="334" font-size="12" fill="#9cc4ab" font-family="'DM Mono', Consolas, monospace">23.21</text>
    <rect x="300" y="342" width="506" height="14" fill="#4a4a52"/>
    <text x="816" y="354" font-size="12" fill="#8f8a82" font-family="'DM Mono', Consolas, monospace">22.64 TVT</text>
    <rect x="300" y="362" width="454" height="14" fill="#4a4a52"/>
    <text x="764" y="374" font-size="12" fill="#8f8a82" font-family="'DM Mono', Consolas, monospace">22.32 PiSA-SR</text>
  </g>
  <line x1="56" y1="392" x2="1064" y2="392" stroke="#2a2a30"/>
  <text x="56" y="416" font-size="12" fill="#78746e" font-family="'DM Mono', Consolas, monospace">推理 0.27 秒 / 1024²（PiSA-SR 0.45 秒），显存 17.63 GB。数据：论文 Table 1、Table 2。</text>
</svg>
