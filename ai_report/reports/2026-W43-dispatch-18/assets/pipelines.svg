<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-label="两条相机管线：左侧三张包围曝光合成 SDR 与增益图，右侧用处理后的 sRGB 和 ISO 预测代理参考图再算全参考指标">
  <rect width="1120" height="460" fill="#0e0e11"/>
  <g font-family="'Noto Serif SC', 'Songti SC', serif" fill="#f0ece4">
    <text x="56" y="58" font-size="24" letter-spacing="1.5">照片背后的两条管线</text>
    <text x="56" y="88" font-size="13" fill="#78746e">一条把三次曝光合成为可显示的 SDR 与可扩展的增益图；一条在没有参考图时，先猜一张参考图</text>
  </g>

  <!-- 左：DOME-HDR -->
  <g font-family="'DM Mono', Consolas, monospace">
    <text x="56" y="140" font-size="12" fill="#b8924e" letter-spacing="2">DOME-HDR / 重建</text>
    <g fill="#b0aca6" font-size="12">
      <rect x="56" y="160" width="70" height="46" rx="4" fill="#17171b" stroke="#2a2a30"/>
      <text x="70" y="188">欠曝</text>
      <rect x="136" y="160" width="70" height="46" rx="4" fill="#17171b" stroke="#2a2a30"/>
      <text x="150" y="188">中间</text>
      <rect x="216" y="160" width="70" height="46" rx="4" fill="#17171b" stroke="#2a2a30"/>
      <text x="230" y="188">过曝</text>
    </g>
    <path d="M286 183 H330" stroke="#b8924e" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="334" y="148" width="150" height="70" rx="5" fill="#141418" stroke="#b8924e" stroke-opacity="0.4"/>
    <text x="348" y="176" font-size="12" fill="#f0ece4">LoRA 潜扩散</text>
    <text x="348" y="196" font-size="11" fill="#78746e">双交叉注意力</text>
    <path d="M484 183 H528" stroke="#b8924e" stroke-width="1.2" marker-end="url(#a)"/>
    <rect x="532" y="148" width="132" height="70" rx="5" fill="#141418" stroke="#b8924e" stroke-opacity="0.4"/>
    <text x="546" y="176" font-size="12" fill="#f0ece4">SDR + 增益图</text>
    <text x="546" y="196" font-size="11" fill="#78746e">HPGM 预测</text>
    <path d="M664 183 H706" stroke="#b8924e" stroke-width="1.2" marker-end="url(#a)"/>
    <text x="712" y="188" font-size="12" fill="#d4b072">HDR</text>
    <text x="56" y="252" font-size="11" fill="#78746e">PU-PSNR 44.63 / LPIPS 0.0156（Challenge123、Tel、Kalantari 平均）</text>
  </g>

  <!-- 右：ISP 评估 -->
  <g font-family="'DM Mono', Consolas, monospace">
    <text x="56" y="316" font-size="12" fill="#5a9a7a" letter-spacing="2">ISP 评估 / 无参考</text>
    <g fill="#b0aca6" font-size="12">
      <rect x="56" y="336" width="150" height="52" rx="4" fill="#17171b" stroke="#2a2a30"/>
      <text x="70" y="358">处理后的 sRGB</text>
      <text x="70" y="376" fill="#78746e">+ ISO 元数据</text>
    </g>
    <path d="M206 362 H250" stroke="#5a9a7a" stroke-width="1.2" marker-end="url(#b)"/>
    <rect x="254" y="336" width="160" height="52" rx="4" fill="#141418" stroke="#5a9a7a" stroke-opacity="0.4"/>
    <text x="268" y="358" font-size="12" fill="#f0ece4">预测代理参考图</text>
    <text x="268" y="376" font-size="11" fill="#78746e">SwinIR + LoRA</text>
    <path d="M414 362 H458" stroke="#5a9a7a" stroke-width="1.2" marker-end="url(#b)"/>
    <text x="466" y="356" font-size="12" fill="#9cc4ab">PSNR / SSIM / LPIPS</text>
    <text x="466" y="376" font-size="11" fill="#78746e">按全参考公式算</text>
    <text x="56" y="418" font-size="11" fill="#78746e">PSNR 的 PLCC 0.969，直接回归只有 0.899；LPIPS 0.944 对 0.587</text>
  </g>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#b8924e"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5a9a7a"/></marker>
  </defs>
</svg>
