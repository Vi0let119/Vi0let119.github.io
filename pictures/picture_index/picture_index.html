<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        /* 尽早应用主题，避免闪白(theme.js 提供切换) */
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') {
                document.documentElement.setAttribute('data-theme', t);
            }
        })();
    </script>
    <title>映像 · Visual Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../theme-toggle.css">
    <link rel="stylesheet" href="../../siderbar/siderbar.css">
    <link rel="stylesheet" href="picture_index.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换日/夜模式" title="切换日/夜模式">
        <span class="theme-icon theme-icon--light">☀</span>
        <span class="theme-icon theme-icon--dark">☽</span>
    </button>
    <div class="theme-grain" aria-hidden="true"></div>
    <div id="sidebar-container"></div>

    <!-- ── 卷首：全屏视频 ── -->
    <section id="hero">
        <video class="hero-video" autoplay loop muted playsinline preload="metadata" poster="../视频/封面-poster.webp">
            <source src="../视频/封面-720.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">映 · 像</h1>
            <p class="hero-subtitle">A curated visual archive</p>
            <div class="scroll-indicator" id="scrollIndicator">
                <span class="scroll-label">Browse the archive</span>
                <div class="scroll-arrow">↓</div>
            </div>
        </div>
    </section>

    <!-- ── 印样长卷：滚动驱动印样条横移，居中帧即选中 ── -->
    <div class="scroll-track" id="gallery">
        <div class="scroll-stage" id="scrollStage">

            <!-- 左侧题签：档案信息 -->
            <aside class="rail-panel" aria-label="Archive 导航">
                <header class="rail-head">
                    <h2 class="rail-title">Archive</h2>
                    <div class="rail-count">
                        <span class="sidebar-count" id="imageCount">232 frames</span>
                    </div>
                </header>
                <div class="rail-progress" aria-live="polite">
                    <span class="frame-now" id="frameNow">—</span>
                    <span class="frame-total" id="frameTotal">/ —</span>
                </div>
                <div class="rail-progress-track" aria-hidden="true">
                    <div class="rail-progress-bar" id="frameProgressBar"></div>
                </div>
                <footer class="rail-caption" id="imageCaption">
                    <span class="caption-filename" id="captionFilename"></span>
                    <span class="caption-date" id="captionDate"></span>
                </footer>
                <button id="overviewBtn" class="rail-overview-btn" type="button"
                        aria-haspopup="dialog" aria-controls="overviewOverlay">
                    总览 · OVERVIEW
                </button>
                <p class="rail-note">滚动页面 · 展开印样长卷<em>SCROLL THE STRIP</em></p>
                <a href="../picture_features/features_visual.html" class="rail-features-link">视觉星图 →</a>
            </aside>

            <!-- 中央看片台 -->
            <div class="viewer-stage">
                <div class="main-placeholder" id="mainPlaceholder">
                    <div class="placeholder-mark">§</div>
                    <p class="placeholder-text">Select a frame<br>from the archive</p>
                </div>
                <div class="main-image-wrap" id="mainImageWrap">
                    <img id="mainImage" alt="" decoding="async">
                </div>
            </div>

            <!-- 底部接触印样条（JS 注入缩略图，滚动驱动横移） -->
            <div class="filmstrip" role="group" aria-label="接触印样条">
                <div class="filmstrip-track" id="thumbnailGrid">
                    <!-- 缩略图由 JS 动态生成 -->
                </div>
            </div>

        </div>
    </div>

    <script src="../../theme.js" defer></script>
    <script src="../../siderbar/sidebar.js"></script>
    <script>
        initSidebar('sidebar-container');
    </script>
    <!-- ── 总览覆盖层：按月分组的全部帧网格 ── -->
    <div class="overview-overlay" id="overviewOverlay" hidden role="dialog" aria-modal="true" aria-label="总览">
        <header class="overview-head">
            <div>
                <h2 class="overview-title">总览</h2>
                <span class="overview-sub">OVERVIEW · 点任意帧跳回长卷 · ESC 返回</span>
            </div>
            <button class="overview-close" id="overviewClose" type="button" aria-label="关闭总览">×</button>
        </header>
        <div class="overview-scroll" id="overviewScroll"></div>
    </div>

    <script src="picture_index.js"></script>

</body>
</html>
